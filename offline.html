<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1d4ed8">
  <title>입실론 오프라인</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f5f7fb;color:#0f172a;font-family:system-ui,'Noto Sans KR',sans-serif}.box{width:min(100%,420px);padding:28px;border:1px solid #dbe3ee;border-radius:18px;background:#fff;box-shadow:0 12px 32px rgba(30,64,175,.08)}.mark{width:52px;height:52px;display:grid;place-items:center;border-radius:15px;background:#1d4ed8;color:#fff;font-size:34px;font-weight:800}h1{margin:20px 0 8px;font-size:23px;letter-spacing:-.03em}p{margin:0;color:#475569;line-height:1.65;font-size:15px}button{width:100%;min-height:48px;margin-top:22px;border:0;border-radius:12px;background:#1d4ed8;color:#fff;font-size:15px;font-weight:700}button:focus-visible{outline:3px solid rgba(37,99,235,.38);outline-offset:3px}
  </style>
</head>
<body><main class="box"><div class="mark" aria-hidden="true">ε</div><h1>인터넷 연결을 확인해 주세요</h1><p>이전에 열어 본 화면은 일부 사용할 수 있습니다. 연결이 복구되면 다시 시도해 주세요.</p><button type="button" onclick="location.reload()">다시 연결</button></main></body>
</html>
